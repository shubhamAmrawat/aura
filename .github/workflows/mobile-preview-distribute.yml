name: Mobile Preview Distribution

on:
  push:
    branches:
      - main
    paths:
      - "apps/mobileApp/**"
      - ".github/workflows/mobile-preview-distribute.yml"
  workflow_dispatch:
    inputs:
      release_notes:
        description: Release notes for testers
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mobile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-distribute:
    name: Build preview APK and distribute
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobileApp
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/mobileApp/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Verify mobile app config
        run: npm run ci:verify

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Builds on this GitHub runner (--local) instead of Expo's cloud, so it doesn't use the
      # EAS Build monthly quota. Signing key and Plain text / Sensitive EAS env vars still come from EAS.
      - name: Build preview APK locally with EAS
        shell: bash
        run: |
          eas build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/aurora-preview.apk"

      - name: Setup Firebase CLI auth
        shell: bash
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        shell: bash
        run: npm install --global firebase-tools

      - name: Upload APK to Firebase App Distribution
        shell: bash
        env:
          RELEASE_NOTES_INPUT: ${{ github.event.inputs.release_notes }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_NOTES="${RELEASE_NOTES_INPUT:-Preview build from ${GITHUB_REF_NAME} (${GITHUB_SHA::7})}"
          EXTRA_ARGS=()
          if [ -n "$FIREBASE_TESTER_GROUPS" ]; then
            EXTRA_ARGS+=(--groups "$FIREBASE_TESTER_GROUPS")
          fi

          firebase appdistribution:distribute "$RUNNER_TEMP/aurora-preview.apk" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            "${EXTRA_ARGS[@]}"
