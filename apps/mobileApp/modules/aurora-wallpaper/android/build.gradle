plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.aurorawallpaper'
version = '1.0.0'

android {
  namespace "expo.modules.aurorawallpaper"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Background wallpaper changer (same WorkManager version Expo used before).
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
